<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10069f">
  <title>London 2026 — Itinerary</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚇</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <h1 id="tripTitle">London 2026</h1>
      <p class="trip-dates" id="tripDates"></p>
      <nav class="view-switch">
        <span class="view-tab active" aria-current="page">Day by day</span>
        <a href="overview.html" class="view-tab">Overview</a>
      </nav>
      <div class="search">
        <input type="search" id="searchInput" class="search-input"
               placeholder="Search the trip — try “butterbeer”, “free”, “bridge”…"
               autocomplete="off" aria-label="Search the itinerary"
               aria-controls="searchResults" aria-expanded="false">
        <button type="button" id="searchClear" class="search-clear" aria-label="Clear search" hidden>✕</button>
        <div id="searchResults" class="search-results" role="listbox" hidden></div>
      </div>
    </div>
  </header>

  <nav class="day-strip-wrap" aria-label="Trip days">
    <div class="wrap">
      <div class="day-strip" id="dayStrip"></div>
    </div>
  </nav>

  <main class="wrap">
    <section id="dayView" class="day-view" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Edit <code>itinerary.js</code> to add or change plans. Sections &amp; more coming later.</p>
    </div>
  </footer>

  <script src="itinerary.js"></script>
  <script src="app.js"></script>
</body>
</html>
